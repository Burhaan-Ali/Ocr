<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Truck License Plate Reader</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      background: #1e1e24;
      color: #fff;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      max-width: 500px;
      width: 100%;
    }
    .video-wrapper {
      position: relative;
      width: 100%;
    }
    video {
      border: 3px solid #444;
      border-radius: 8px;
      width: 100%;
      background: #000;
    }
    /* Targeting reticle to help center the plate */
    .overlay {
      position: absolute;
      top: 35%;
      left: 10%;
      width: 80%;
      height: 30%;
      border: 2px dashed #00ffcc;
      border-radius: 6px;
      pointer-events: none;
      box-sizing: border-box;
    }
    button {
      padding: 12px 24px;
      font-size: 18px;
      font-weight: bold;
      color: #000;
      background: #00ffcc;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
    }
    button:disabled { background: #555; color: #888; }
    #output {
      width: 100%;
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 2px;
      text-align: center;
      background: #2b2b36;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 15px;
      box-sizing: border-box;
      color: #00ffcc;
    }
    #status { font-size: 14px; color: #aaa; }
  </style>
</head>
<body>

<div class="container">
  <h2>Truck Plate Reader</h2>
  
  <div class="video-wrapper">
    <video id="webcam" autoplay playsinline></video>
    <div class="overlay"></div>
  </div>
  
  <button id="scan-btn">Read Plate</button>
  
  <div id="status">Status: Starting camera...</div>
  <div id="output">---</div>
  
  <canvas id="snapshot" style="display: none;"></canvas>
</div>

<script>
  const video = document.getElementById('webcam');
  const canvas = document.getElementById('snapshot');
  const scanBtn = document.getElementById('scan-btn');
  const statusDiv = document.getElementById('status');
  const outputDiv = document.getElementById('output');
  let worker = null;

  // Initialize Tesseract Worker with specific license plate constraints
  async function initOCR() {
    statusDiv.innerText = "Status: Loading OCR Engine...";
    worker = await Tesseract.createWorker('eng');
    
    // Whitelist uppercase alphanumeric characters only
    await worker.setParameters({
      tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789',
    });
    
    statusDiv.innerText = "Status: Ready. Frame the plate and tap Read.";
  }

  // Access camera with focus/resolution preferences for mobile webcams
  navigator.mediaDevices.getUserMedia({ 
    video: { 
      facingMode: 'environment',
      width: { ideal: 1920 },
      height: { ideal: 1080 }
    } 
  }).then(stream => {
    video.srcObject = stream;
    initOCR();
  }).catch(err => {
    console.error("Camera error:", err);
    statusDiv.innerText = "Status: Camera access denied or unavailable.";
  });

  scanBtn.addEventListener('click', async () => {
    if (!video.videoWidth || !worker) return;

    scanBtn.disabled = true;
    statusDiv.innerText = "Status: Processing image...";
    outputDiv.innerText = "...";

    // 1. Draw frame to canvas
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0);

    // 2. Preprocess: Convert canvas image to Grayscale + High Contrast
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imageData.data;
    for (let i = 0; i < data.length; i += 4) {
      // Luminance calculation
      let avg = 0.2126 * data[i] + 0.7152 * data[i + 1] + 0.0722 * data[i + 2];
      // Simple contrast stretch
      avg = avg > 128 ? Math.min(255, avg * 1.2) : Math.max(0, avg * 0.8);
      data[i] = avg;     // Red
      data[i + 1] = avg; // Green
      data[i + 2] = avg; // Blue
    }
    ctx.putImageData(imageData, 0, 0);

    // 3. Run OCR on processed canvas
    try {
      const { data: { text } } = await worker.recognize(canvas);
      // Clean up extra whitespace/newlines
      const cleanText = text.replace(/[^A-Z0-9]/g, '');
      
      outputDiv.innerText = cleanText || "NO PLATE DETECTED";
      statusDiv.innerText = "Status: Ready for next scan.";
    } catch (err) {
      console.error(err);
      statusDiv.innerText = "Status: Scan failed. Try again.";
    } finally {
      scanBtn.disabled = false;
    }
  });
</script>

</body>
</html>
