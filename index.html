<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camera OCR Project</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      background: #f4f4f9;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      max-width: 600px;
    }
    video, canvas {
      border: 2px solid #333;
      border-radius: 8px;
      width: 100%;
      max-width: 500px;
      background-color: #000;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      background-color: #007bff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:disabled { background-color: #aaa; }
    #output {
      width: 100%;
      min-height: 80px;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 5px;
      padding: 15px;
      box-sizing: border-box;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Camera Text & Number Reader</h2>
  
  <video id="webcam" autoplay playsinline></video>
  <button id="capture-btn">Scan Text</button>
  
  <canvas id="snapshot" style="display: none;"></canvas>
  
  <div id="status">Status: Initializing camera...</div>
  <div id="output">Scanned text will appear here...</div>
</div>

<script>
  const video = document.getElementById('webcam');
  const canvas = document.getElementById('snapshot');
  const captureBtn = document.getElementById('capture-btn');
  const statusDiv = document.getElementById('status');
  const outputDiv = document.getElementById('output');

  // 1. Access the camera
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
    .then(stream => {
      video.srcObject = stream;
      statusDiv.innerText = 'Status: Camera ready. Frame text and click "Scan Text".';
    })
    .catch(err => {
      console.error("Camera access error:", err);
      statusDiv.innerText = 'Status: Error accessing camera. Please grant permissions.';
    });

  // 2. Capture and process frame
  captureBtn.addEventListener('click', async () => {
    if (!video.videoWidth) return;

    // Draw current video frame to canvas
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    // Update UI
    captureBtn.disabled = true;
    statusDiv.innerText = 'Status: Reading text (this may take a few seconds)...';
    outputDiv.innerText = '';

    try {
      // 3. Perform OCR using Tesseract.js
      const result = await Tesseract.recognize(canvas, 'eng');
      
      statusDiv.innerText = 'Status: Done!';
      outputDiv.innerText = result.data.text.trim() || '[No text detected]';
    } catch (error) {
      console.error(error);
      statusDiv.innerText = 'Status: Failed to read text.';
    } finally {
      captureBtn.disabled = false;
    }
  });
</script>

</body>
</html>
