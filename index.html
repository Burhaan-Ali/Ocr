<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Truck Parking Management System</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root {
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --bg-dark: #0f172a;
    --card-bg: #1e293b;
    --card-border: #334155;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --accent-green: #10b981;
    --accent-amber: #f59e0b;
    --accent-red: #ef4444;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
  body { background-color: var(--bg-dark); color: var(--text-main); padding: 16px; min-height: 100vh; padding-bottom: 80px; }
  .container { max-width: 1200px; margin: 0 auto; }

  header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--card-border);
    flex-wrap: wrap; gap: 12px;
  }
  .header-title h1 { font-size: 1.5rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
  .header-title p { color: var(--text-muted); font-size: 0.85rem; margin-top: 2px; }

  .stats-bar { display: flex; gap: 12px; width: 100%; }
  @media (min-width: 640px) { .stats-bar { width: auto; } }
  .stat-card {
    background: var(--card-bg); border: 1px solid var(--card-border);
    padding: 10px 16px; border-radius: 8px; text-align: center; flex: 1;
  }
  .stat-card .val { font-size: 1.3rem; font-weight: 700; color: var(--accent-green); }
  .stat-card .lbl { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

  .layout { display: grid; grid-template-columns: 1fr; gap: 20px; }
  @media (min-width: 900px) { .layout { grid-template-columns: 340px 1fr; } }

  .card {
    background: var(--card-bg); border: 1px solid var(--card-border);
    border-radius: 12px; padding: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
  }
  .card-title { font-size: 1rem; font-weight: 600; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }

  form { display: flex; flex-direction: column; gap: 12px; }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  label { font-size: 0.8rem; font-weight: 500; color: var(--text-muted); }

  input, select, textarea {
    background: #0f172a; border: 1px solid var(--card-border);
    color: var(--text-main); padding: 12px; border-radius: 8px;
    font-size: 1rem; outline: none; transition: border-color 0.2s; width: 100%;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--primary); }

  .btn {
    background: var(--primary); color: white; border: none; padding: 14px;
    border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 1rem;
    display: flex; justify-content: center; align-items: center; gap: 8px;
    transition: background 0.2s; min-height: 48px;
  }
  .btn:hover { background: var(--primary-hover); }
  .btn-outline { background: transparent; border: 1px solid var(--card-border); color: var(--text-main); }
  .btn-outline:hover { background: rgba(255, 255, 255, 0.05); }
  .btn-danger { background: var(--accent-red); }
  .btn-danger:hover { background: #dc2626; }
  .btn-sm { padding: 8px 12px; font-size: 0.85rem; border-radius: 6px; min-height: 38px; }

  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 10px; flex-wrap: wrap; }
  .search-box { position: relative; flex: 1; min-width: 100%; }
  @media (min-width: 640px) { .search-box { min-width: 200px; } }
  .search-box i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
  .search-box input { padding-left: 38px; }

  /* Desktop Table Views */
  .desktop-table { display: none; width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
  @media (min-width: 768px) { .desktop-table { display: table; } }
  th { background: #0f172a; color: var(--text-muted); font-weight: 600; padding: 12px; border-bottom: 1px solid var(--card-border); white-space: nowrap; }
  td { padding: 12px; border-bottom: 1px solid var(--card-border); }
  tbody tr:hover { background: rgba(255, 255, 255, 0.02); }

  /* Mobile Responsive Cards */
  .mobile-cards { display: flex; flex-direction: column; gap: 12px; }
  @media (min-width: 768px) { .mobile-cards { display: none; } }

  .truck-card {
    background: #0f172a; border: 1px solid var(--card-border);
    border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 10px;
  }
  .truck-card-header { display: flex; justify-content: space-between; align-items: center; }
  .truck-card-body { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 0.85rem; color: var(--text-muted); }
  .truck-card-actions { display: flex; gap: 8px; margin-top: 4px; border-top: 1px solid var(--card-border); padding-top: 10px; }

  .plate-tag {
    background: #fbbf24; color: #000; font-family: monospace; font-weight: 700;
    padding: 4px 8px; border-radius: 4px; border: 2px solid #000; display: inline-block; letter-spacing: 1px; font-size: 0.9rem;
  }
  .days-badge {
    background: rgba(16, 185, 129, 0.15); color: var(--accent-green); font-weight: 700;
    padding: 4px 10px; border-radius: 12px; display: inline-flex; align-items: center; gap: 4px; font-size: 0.85rem;
  }
  .days-badge.warning { background: rgba(245, 158, 11, 0.15); color: var(--accent-amber); }
  .days-badge.danger { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); }

  .actions-cell { display: flex; gap: 6px; }
  .empty-state { text-align: center; padding: 40px; color: var(--text-muted); }
  .empty-state i { font-size: 2.5rem; margin-bottom: 12px; opacity: 0.5; }

  .tab-buttons { display: flex; gap: 8px; margin-bottom: 14px; }
  .tab-btn {
    padding: 10px 14px; border-radius: 6px; background: transparent; flex: 1;
    border: 1px solid var(--card-border); color: var(--text-muted); cursor: pointer;
    font-size: 0.85rem; font-weight: 500; text-align: center;
  }
  .tab-btn.active { background: var(--primary); border-color: var(--primary); color: white; }

  /* Mobile Bottom Dock Bar */
  .mobile-nav {
    position: fixed; bottom: 0; left: 0; right: 0; background: #0f172a;
    border-top: 1px solid var(--card-border); display: flex; justify-content: space-around;
    padding: 8px 0; z-index: 900;
  }
  @media (min-width: 900px) { .mobile-nav { display: none; } }
  .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-muted); font-size: 0.7rem; text-decoration: none; border: none; background: transparent; cursor: pointer; }
  .nav-item.active { color: var(--primary); }
  .nav-item i { font-size: 1.2rem; }

  /* Modal styling */
  .modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8);
    display: flex; justify-content: center; align-items: center; z-index: 1000;
    opacity: 0; pointer-events: none; transition: opacity 0.2s; padding: 16px;
  }
  .modal-overlay.active { opacity: 1; pointer-events: auto; }
  .modal { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; width: 100%; max-width: 500px; padding: 20px; max-height: 85vh; overflow-y: auto; }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; border-bottom: 1px solid var(--card-border); padding-bottom: 10px; }
  .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }

  .history-timeline { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
  .history-card { background: #0f172a; border: 1px solid var(--card-border); border-radius: 8px; padding: 12px; display: flex; justify-content: space-between; align-items: center; }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-title">
      <h1><i class="fa-solid fa-truck-ramp-box"></i> TruckPark Log</h1>
      <p>Daily Registration & Multi-Visit Mobile Tracker</p>
    </div>
    <div class="stats-bar">
      <div class="stat-card">
        <div class="val" id="stat-currently-parked">0</div>
        <div class="lbl">Currently Parked</div>
      </div>
      <div class="stat-card">
        <div class="val" id="stat-total-visits" style="color: var(--primary);">0</div>
        <div class="lbl">Total Visits</div>
      </div>
    </div>
  </header>

  <div class="layout">
    <div class="card" id="registerSection">
      <div class="card-title">
        <i class="fa-solid fa-plus-circle" style="color: var(--primary);"></i> Register Truck Visit
      </div>
      <form id="parkForm">
        <div class="form-group">
          <label for="plateNumber">Plate Number *</label>
          <input type="text" id="plateNumber" placeholder="e.g. TRK-482-AA" required style="text-transform: uppercase;">
        </div>
        <div class="form-group">
          <label for="spotNumber">Spot # (Optional)</label>
          <input type="text" id="spotNumber" placeholder="e.g. Bay 04">
        </div>
        <div class="form-group">
          <label for="truckDetails">Truck Model / Color</label>
          <input type="text" id="truckDetails" placeholder="e.g. Blue Scania Trailer">
        </div>
        <div class="form-group">
          <label for="entryDate">Entry Date</label>
          <input type="date" id="entryDate" required>
        </div>
        <div class="form-group">
          <label for="notes">Notes</label>
          <textarea id="notes" rows="2" placeholder="Driver contact, cargo details..."></textarea>
        </div>
        <button type="submit" class="btn">
          <i class="fa-solid fa-square-check"></i> Register Entry
        </button>
      </form>
    </div>

    <div id="listSection">
      <div class="tab-buttons">
        <button class="tab-btn active" id="tabActive" onclick="switchTab('active')">
          <i class="fa-solid fa-truck"></i> Active (<span id="activeCount">0</span>)
        </button>
        <button class="tab-btn" id="tabHistory" onclick="switchTab('history')">
          <i class="fa-solid fa-clock-rotate-left"></i> Departed (<span id="historyCount">0</span>)
        </button>
      </div>

      <div class="card">
        <div class="toolbar">
          <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Search plate or spot..." onkeyup="render()">
          </div>
          <button class="btn btn-outline btn-sm" onclick="exportData()" style="width: 100%; justify-content: center;">
            <i class="fa-solid fa-file-csv"></i> Export CSV
          </button>
        </div>

        <table class="desktop-table">
          <thead>
            <tr>
              <th>Spot</th>
              <th>Plate Number</th>
              <th>Entry Date</th>
              <th>Days Parked</th>
              <th>Details</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>

        <div class="mobile-cards" id="mobileCardsContainer"></div>

        <div id="emptyState" class="empty-state" style="display: none;">
          <i class="fa-solid fa-truck-field"></i>
          <p>No records found.</p>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="mobile-nav">
  <button class="nav-item" onclick="scrollToSection('registerSection')">
    <i class="fa-solid fa-plus-circle"></i>
    <span>Register</span>
  </button>
  <button class="nav-item active" id="navActiveTab" onclick="switchTab('active'); scrollToSection('listSection');">
    <i class="fa-solid fa-truck"></i>
    <span>Active</span>
  </button>
  <button class="nav-item" id="navHistoryTab" onclick="switchTab('history'); scrollToSection('listSection');">
    <i class="fa-solid fa-clock-rotate-left"></i>
    <span>History</span>
  </button>
</div>

<div class="modal-overlay" id="checkoutModal">
  <div class="modal">
    <div class="modal-header">
      <h3>Truck Exit Confirmation</h3>
      <i class="fa-solid fa-xmark" style="cursor: pointer; font-size:1.2rem;" onclick="closeModal('checkoutModal')"></i>
    </div>
    <div>
      <p>Checkout plate: <strong id="modalPlate" class="plate-tag"></strong>?</p>
      <br>
      <p style="font-size: 0.9rem; color: var(--text-muted);">Total Duration: <strong id="modalDays"></strong></p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline btn-sm" onclick="closeModal('checkoutModal')">Cancel</button>
      <button class="btn btn-danger btn-sm" id="confirmCheckoutBtn">Confirm Exit</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="historyModal">
  <div class="modal">
    <div class="modal-header">
      <h3>Visit Timeline: <span id="historyPlateTitle" class="plate-tag"></span></h3>
      <i class="fa-solid fa-xmark" style="cursor: pointer; font-size:1.2rem;" onclick="closeModal('historyModal')"></i>
    </div>
    <div id="historyTimelineContainer" class="history-timeline"></div>
    <div class="modal-footer">
      <button class="btn btn-outline btn-sm" onclick="closeModal('historyModal')">Close</button>
    </div>
  </div>
</div>

<script>
  let trucks = JSON.parse(localStorage.getItem('truck_parking_db')) || [
    { id: 1, plate: 'TRK-482-AA', spot: 'Bay 01', details: 'Red Scania', entryDate: '2026-08-01', exitDate: '2026-08-05', status: 'history', notes: 'Visit 1' },
    { id: 2, plate: 'TRK-482-AA', spot: 'Bay 01', details: 'Red Scania', entryDate: '2026-08-08', exitDate: '2026-08-11', status: 'history', notes: 'Visit 2' },
    { id: 3, plate: 'TRK-482-AA', spot: 'Bay 03', details: 'Red Scania', entryDate: getFormattedDate(-1), status: 'active', notes: 'Visit 3 (Current)' }
  ];

  let currentTab = 'active';
  let checkoutTargetId = null;

  function getFormattedDate(offsetDays = 0) {
    const d = new Date();
    d.setDate(d.getDate() + offsetDays);
    return d.toISOString().split('T')[0];
  }

  function calculateDays(entryDateStr, exitDateStr = null) {
    const start = new Date(entryDateStr);
    const end = exitDateStr ? new Date(exitDateStr) : new Date();
    start.setHours(0,0,0,0);
    end.setHours(0,0,0,0);
    const diffTime = Math.abs(end - start);
    return Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
  }

  function saveData() {
    localStorage.setItem('truck_parking_db', JSON.stringify(trucks));
    render();
  }

  document.getElementById('entryDate').value = getFormattedDate(0);

  document.getElementById('parkForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const plate = document.getElementById('plateNumber').value.trim().toUpperCase();
    const spot = document.getElementById('spotNumber').value.trim() || 'N/A';
    const details = document.getElementById('truckDetails').value.trim();
    const entryDate = document.getElementById('entryDate').value;
    const notes = document.getElementById('notes').value.trim();

    const existingIndex = trucks.findIndex(t => t.plate === plate && t.status === 'active');
    if (existingIndex !== -1) {
      alert(`Truck ${plate} is ALREADY active in Spot ${trucks[existingIndex].spot}. Check it out before creating a new visit.`);
      return;
    }

    trucks.unshift({ id: Date.now(), plate, spot, details, entryDate, status: 'active', notes });
    saveData();
    this.reset();
    document.getElementById('entryDate').value = getFormattedDate(0);
    scrollToSection('listSection');
  });

  function switchTab(tab) {
    currentTab = tab;
    document.getElementById('tabActive').classList.toggle('active', tab === 'active');
    document.getElementById('tabHistory').classList.toggle('active', tab === 'history');
    render();
  }

  function scrollToSection(id) {
    document.getElementById(id).scrollIntoView({ behavior: 'smooth' });
  }

  function render() {
    const tbody = document.getElementById('tableBody');
    const mobileContainer = document.getElementById('mobileCardsContainer');
    const searchTerm = document.getElementById('searchInput').value.toLowerCase();
    
    tbody.innerHTML = '';
    mobileContainer.innerHTML = '';

    const activeList = trucks.filter(t => t.status === 'active');
    const historyList = trucks.filter(t => t.status === 'history');

    document.getElementById('activeCount').innerText = activeList.length;
    document.getElementById('historyCount').innerText = historyList.length;
    document.getElementById('stat-currently-parked').innerText = activeList.length;
    document.getElementById('stat-total-visits').innerText = trucks.length;

    const list = (currentTab === 'active' ? activeList : historyList).filter(t => 
      t.plate.toLowerCase().includes(searchTerm) || t.spot.toLowerCase().includes(searchTerm)
    );

    document.getElementById('emptyState').style.display = list.length === 0 ? 'block' : 'none';

    list.forEach(truck => {
      const days = calculateDays(truck.entryDate, truck.exitDate);
      let badgeClass = 'days-badge' + (days > 7 ? ' danger' : days > 3 ? ' warning' : '');

      // Desktop Table Render
      const tr = document.createElement('tr');
      if (currentTab === 'active') {
        tr.innerHTML = `
          <td><strong>${escapeHtml(truck.spot)}</strong></td>
          <td><span class="plate-tag">${escapeHtml(truck.plate)}</span></td>
          <td>${truck.entryDate}</td>
          <td><span class="${badgeClass}">Day ${days}</span></td>
          <td>${escapeHtml(truck.details || '-')}</td>
          <td class="actions-cell">
            <button class="btn btn-outline btn-sm" onclick="showTruckHistory('${truck.plate}')"><i class="fa-solid fa-clock-rotate-left"></i></button>
            <button class="btn btn-outline btn-sm" onclick="openCheckout(${truck.id})"><i class="fa-solid fa-arrow-right-from-bracket"></i> Exit</button>
            <button class="btn btn-outline btn-sm" style="color:var(--accent-red)" onclick="deleteTruck(${truck.id})"><i class="fa-solid fa-trash"></i></button>
          </td>
        `;
      } else {
        tr.innerHTML = `
          <td><strong>${escapeHtml(truck.spot)}</strong></td>
          <td><span class="plate-tag">${escapeHtml(truck.plate)}</span></td>
          <td>${truck.entryDate}</td>
          <td>${truck.exitDate || '-'}</td>
          <td><span class="days-badge">${days} Days</span></td>
          <td class="actions-cell">
            <button class="btn btn-outline btn-sm" onclick="showTruckHistory('${truck.plate}')"><i class="fa-solid fa-clock-rotate-left"></i></button>
            <button class="btn btn-outline btn-sm" style="color:var(--accent-red)" onclick="deleteTruck(${truck.id})"><i class="fa-solid fa-trash"></i></button>
          </td>
        `;
      }
      tbody.appendChild(tr);

      // Mobile Card Render
      const card = document.createElement('div');
      card.className = 'truck-card';
      card.innerHTML = `
        <div class="truck-card-header">
          <span class="plate-tag">${escapeHtml(truck.plate)}</span>
          <span class="${badgeClass}">${currentTab === 'active' ? 'Day ' + days : days + ' Days Total'}</span>
        </div>
        <div class="truck-card-body">
          <div><strong>Spot:</strong> ${escapeHtml(truck.spot)}</div>
          <div><strong>Entry:</strong> ${truck.entryDate}</div>
          ${truck.exitDate ? `<div><strong>Exit:</strong> ${truck.exitDate}</div>` : ''}
          <div><strong>Details:</strong> ${escapeHtml(truck.details || 'N/A')}</div>
        </div>
        <div class="truck-card-actions">
          <button class="btn btn-outline btn-sm" style="flex:1" onclick="showTruckHistory('${truck.plate}')"><i class="fa-solid fa-clock-rotate-left"></i> History</button>
          ${currentTab === 'active' ? `<button class="btn btn-outline btn-sm" style="flex:1" onclick="openCheckout(${truck.id})"><i class="fa-solid fa-arrow-right-from-bracket"></i> Exit</button>` : ''}
          <button class="btn btn-outline btn-sm" style="color:var(--accent-red)" onclick="deleteTruck(${truck.id})"><i class="fa-solid fa-trash"></i></button>
        </div>
      `;
      mobileContainer.appendChild(card);
    });
  }

  function showTruckHistory(plate) {
    const visits = trucks.filter(t => t.plate === plate).sort((a,b) => new Date(b.entryDate) - new Date(a.entryDate));
    const container = document.getElementById('historyTimelineContainer');
    document.getElementById('historyPlateTitle').innerText = plate;
    container.innerHTML = '';

    visits.forEach(v => {
      const days = calculateDays(v.entryDate, v.exitDate);
      const isCurrent = v.status === 'active';
      const div = document.createElement('div');
      div.className = 'history-card';
      div.innerHTML = `
        <div>
          <strong style="color: ${isCurrent ? 'var(--accent-green)' : 'var(--text-main)'}">
            ${isCurrent ? '🟢 Active Stay' : '⚪ Completed Stay'}
          </strong>
          <div style="font-size:0.8rem; color:var(--text-muted); margin-top:4px;">
            In: <strong>${v.entryDate}</strong> | Out: <strong>${v.exitDate || 'Parked Now'}</strong>
          </div>
        </div>
        <div>
          <span class="days-badge ${isCurrent ? '' : 'warning'}">${days} Days</span>
        </div>
      `;
      container.appendChild(div);
    });

    document.getElementById('historyModal').classList.add('active');
  }

  function openCheckout(id) {
    const truck = trucks.find(t => t.id === id);
    if (!truck) return;
    checkoutTargetId = id;
    document.getElementById('modalPlate').innerText = truck.plate;
    document.getElementById('modalDays').innerText = calculateDays(truck.entryDate) + ' Days';
    document.getElementById('checkoutModal').classList.add('active');
  }

  function closeModal(modalId) {
    document.getElementById(modalId).classList.remove('active');
  }

  document.getElementById('confirmCheckoutBtn').addEventListener('click', function() {
    if (!checkoutTargetId) return;
    const truck = trucks.find(t => t.id === checkoutTargetId);
    if (truck) {
      truck.status = 'history';
      truck.exitDate = getFormattedDate(0);
      saveData();
    }
    closeModal('checkoutModal');
  });

  function deleteTruck(id) {
    if (confirm("Delete this visit record permanently?")) {
      trucks = trucks.filter(t => t.id !== id);
      saveData();
    }
  }

  function exportData() {
    let csv = "data:text/csv;charset=utf-8,Spot,Plate Number,Entry Date,Exit Date,Status,Days Parked\n";
    trucks.forEach(t => {
      csv += `"${t.spot}","${t.plate}","${t.entryDate}","${t.exitDate || ''}","${t.status}","${calculateDays(t.entryDate, t.exitDate)}"\n`;
    });
    const link = document.createElement("a");
    link.href = encodeURI(csv);
    link.download = `truck_parking_export_${getFormattedDate(0)}.csv`;
    link.click();
  }

  function escapeHtml(str) { return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : ''; }

  render();
</script>
</body>
</html>
