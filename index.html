<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Truck Parking Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root {
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --bg-dark: #0f172a;
    --card-bg: #1e293b;
    --card-border: #334155;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --accent-green: #10b981;
    --accent-amber: #f59e0b;
    --accent-red: #ef4444;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
  body { background-color: var(--bg-dark); color: var(--text-main); padding: 16px; min-height: 100vh; }
  .container { max-width: 1000px; margin: 0 auto; }

  header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--card-border);
    flex-wrap: wrap; gap: 12px;
  }
  .header-title h1 { font-size: 1.5rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
  .header-title p { color: var(--text-muted); font-size: 0.85rem; margin-top: 2px; }
  .header-actions { display: flex; gap: 8px; align-items: center; }

  .btn {
    background: var(--primary); color: white; border: none; padding: 8px 14px;
    border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.85rem;
    display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
  }
  .btn:hover { background: var(--primary-hover); }
  .btn-outline { background: transparent; border: 1px solid var(--card-border); color: var(--text-main); }
  .btn-outline:hover { background: rgba(255, 255, 255, 0.05); }
  .btn-danger { background: var(--accent-red); }
  .btn-danger:hover { background: #dc2626; }
  .btn-success { background: var(--accent-green); }
  .btn-success:hover { background: #059669; }

  .btn-bell {
    background: transparent; border: 1px solid var(--card-border); color: var(--accent-amber);
    padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 6px;
  }
  .btn-bell.active { background: var(--accent-amber); color: #000; border-color: var(--accent-amber); font-weight: 700; }

  .stats-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; margin-bottom: 20px; }
  .stat-card {
    background: var(--card-bg); border: 1px solid var(--card-border);
    padding: 12px 16px; border-radius: 8px; text-align: center;
  }
  .stat-card .val { font-size: 1.4rem; font-weight: 700; color: var(--accent-green); }
  .stat-card .lbl { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

  .card {
    background: var(--card-bg); border: 1px solid var(--card-border);
    border-radius: 12px; padding: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3); margin-bottom: 20px;
  }

  .toolbar { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  @media (min-width: 640px) { .toolbar { flex-direction: row; } }

  .search-wrapper { position: relative; flex: 1; width: 100%; }
  .search-wrapper i.search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 1rem; }
  .search-wrapper input {
    background: #0f172a; border: 1px solid var(--card-border); color: var(--text-main);
    padding: 10px 36px 10px 42px; border-radius: 8px; font-size: 0.95rem; width: 100%; outline: none; height: 44px;
  }
  .clear-search {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    color: var(--text-muted); cursor: pointer; display: none; font-size: 0.9rem;
    background: transparent; border: none;
  }
  .clear-search.active { display: block; }

  .desktop-table { display: none; width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
  @media (min-width: 768px) { .desktop-table { display: table; } }
  th { background: #0f172a; color: var(--text-muted); font-weight: 600; padding: 12px; border-bottom: 1px solid var(--card-border); }
  td { padding: 12px; border-bottom: 1px solid var(--card-border); }

  .mobile-cards { display: flex; flex-direction: column; gap: 12px; }
  @media (min-width: 768px) { .mobile-cards { display: none; } }

  .truck-card {
    background: #0f172a; border: 1px solid var(--card-border);
    border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 10px;
  }
  .truck-card-header { display: flex; justify-content: space-between; align-items: center; }
  .truck-card-body { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 0.85rem; color: var(--text-muted); }
  .truck-card-actions { border-top: 1px solid var(--card-border); padding-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }

  .plate-tag {
    background: #fbbf24; color: #000; font-family: monospace; font-weight: 700;
    padding: 4px 8px; border-radius: 4px; border: 2px solid #000; display: inline-block; font-size: 0.9rem;
  }
  .days-badge {
    background: rgba(16, 185, 129, 0.15); color: var(--accent-green); font-weight: 700;
    padding: 4px 10px; border-radius: 12px; display: inline-flex; align-items: center; gap: 4px; font-size: 0.85rem;
  }
  .days-badge.warning { background: rgba(245, 158, 11, 0.15); color: var(--accent-amber); }
  .days-badge.danger { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); }

  .tab-buttons { display: flex; gap: 8px; margin-bottom: 14px; }
  .tab-btn {
    padding: 10px 14px; border-radius: 6px; background: transparent; flex: 1;
    border: 1px solid var(--card-border); color: var(--text-muted); cursor: pointer;
    font-size: 0.85rem; font-weight: 500; text-align: center;
  }
  .tab-btn.active { background: var(--primary); border-color: var(--primary); color: white; }

  .empty-state { text-align: center; padding: 40px; color: var(--text-muted); }

  .modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85);
    display: flex; justify-content: center; align-items: center; z-index: 1000;
    opacity: 0; pointer-events: none; transition: opacity 0.2s; padding: 16px;
  }
  .modal-overlay.active { opacity: 1; pointer-events: auto; }
  .modal { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; width: 100%; max-width: 480px; padding: 20px; }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; border-bottom: 1px solid var(--card-border); padding-bottom: 10px; }
  .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }

  form { display: flex; flex-direction: column; gap: 12px; }
  .form-group { display: flex; flex-direction: column; gap: 6px; text-align: left; }
  label { font-size: 0.8rem; font-weight: 500; color: var(--text-muted); }
  input, select, textarea {
    background: #0f172a; border: 1px solid var(--card-border); color: var(--text-main);
    padding: 10px; border-radius: 6px; font-size: 0.9rem; outline: none;
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-title">
      <h1><i class="fa-solid fa-user-gear"></i> TruckPark Management</h1>
      <p>Admin Parking Controller</p>
    </div>
    <div class="header-actions">
      <button class="btn-bell" id="enableNotifyBtn" onclick="requestNotificationPermission()">
        <i class="fa-solid fa-bell"></i> Enable Alerts
      </button>
      <a href="viewer.html" class="btn btn-outline"><i class="fa-solid fa-eye"></i> Viewer Mode</a>
      <button class="btn btn-outline" onclick="logoutAdmin()"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
    </div>
  </header>

  <div class="stats-bar">
    <div class="stat-card">
      <div class="val" id="stat-currently-parked">0</div>
      <div class="lbl">Parked</div>
    </div>
    <div class="stat-card">
      <div class="val" id="stat-total-departed" style="color: var(--accent-amber);">0</div>
      <div class="lbl">Departed</div>
    </div>
    <div class="stat-card">
      <div class="val" id="stat-total-visits" style="color: var(--primary);">0</div>
      <div class="lbl">Total Visits</div>
    </div>
  </div>

  <div class="tab-buttons">
    <button class="tab-btn active" id="tabActive" onclick="switchTab('active')">
      <i class="fa-solid fa-truck"></i> Active (<span id="activeCount">0</span>)
    </button>
    <button class="tab-btn" id="tabHistory" onclick="switchTab('history')">
      <i class="fa-solid fa-clock-rotate-left"></i> Departed (<span id="historyCount">0</span>)
    </button>
  </div>

  <div class="card">
    <div class="toolbar">
      <div class="search-wrapper">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" id="searchInput" placeholder="Search plate, spot, notes..." oninput="handleSearchInput()">
        <button class="clear-search" id="clearSearchBtn" onclick="clearSearch()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <button class="btn btn-success" onclick="openAddModal()"><i class="fa-solid fa-plus"></i> Register Truck</button>
    </div>

    <table class="desktop-table">
      <thead>
        <tr>
          <th>Spot</th>
          <th>Plate Number</th>
          <th>Entry Date</th>
          <th>Duration</th>
          <th>Details</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>

    <div class="mobile-cards" id="mobileCardsContainer"></div>

    <div id="emptyState" class="empty-state" style="display: none;">
      <p id="emptyStateText">No matching records found.</p>
    </div>
  </div>
</div>

<!-- ADD/EDIT TRUCK MODAL -->
<div class="modal-overlay" id="truckModal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">Register Truck Entry</h3>
      <i class="fa-solid fa-xmark" style="cursor: pointer;" onclick="closeModal('truckModal')"></i>
    </div>
    <form id="truckForm" onsubmit="handleFormSubmit(event)">
      <input type="hidden" id="truckDocId">
      <div class="form-group">
        <label>Plate Number *</label>
        <input type="text" id="plateInput" required placeholder="e.g. KAA 123X">
      </div>
      <div class="form-group">
        <label>Spot / Location *</label>
        <input type="text" id="spotInput" placeholder="e.g. Bay 04">
      </div>
      <div class="form-group">
        <label>Entry Date *</label>
        <input type="date" id="entryDateInput" required>
      </div>
      <div class="form-group">
        <label>Details / Cargo</label>
        <input type="text" id="detailsInput" placeholder="e.g. Container 40ft">
      </div>
      <div class="form-group">
        <label>Notes</label>
        <textarea id="notesInput" rows="2" placeholder="Optional notes..."></textarea>
      </div>
      <div class="modal-footer" style="padding:0; margin-top:10px;">
        <button type="button" class="btn btn-outline" onclick="closeModal('truckModal')">Cancel</button>
        <button type="submit" class="btn btn-success">Save Record</button>
      </div>
    </form>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  if (sessionStorage.getItem('authenticated') !== 'true') {
    window.location.href = 'viewer.html';
  }

  const firebaseConfig = {
    apiKey: "AIzaSyDvjeTogG8mOArbl8K1m0JHC5y2UQO-Olo",
    authDomain: "parking-ea350.firebaseapp.com",
    projectId: "parking-ea350",
    storageBucket: "parking-ea350.firebasestorage.app",
    messagingSenderId: "415438583979",
    appId: "1:415438583979:web:96cd9482a8262bc66d5fee"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const trucksCollection = collection(db, "trucks");

  let trucks = [];
  let currentTab = 'active';
  let isInitialLoad = true;

  window.addEventListener('DOMContentLoaded', () => {
    updateNotificationBtnStatus();
    document.getElementById('entryDateInput').value = new Date().toISOString().split('T')[0];
  });

  window.requestNotificationPermission = function() {
    if (!("Notification" in window)) {
      alert("This browser does not support mobile system notifications.");
      return;
    }
    Notification.requestPermission().then((permission) => {
      updateNotificationBtnStatus();
      if (permission === "granted") {
        new Notification("Truck Park System", {
          body: "Admin mobile notifications activated!",
          icon: "https://cdn-icons-png.flaticon.com/512/2554/2554978.png"
        });
      }
    });
  };

  function updateNotificationBtnStatus() {
    const btn = document.getElementById('enableNotifyBtn');
    if (!("Notification" in window)) return;
    if (Notification.permission === "granted") {
      btn.classList.add('active');
      btn.innerHTML = `<i class="fa-solid fa-bell-circle-check"></i> Alerts Active`;
    } else {
      btn.classList.remove('active');
      btn.innerHTML = `<i class="fa-solid fa-bell"></i> Enable Alerts`;
    }
  }

  function sendMobilePush(title, message, tag) {
    if ("Notification" in window && Notification.permission === "granted") {
      new Notification(title, {
        body: message,
        icon: "https://cdn-icons-png.flaticon.com/512/2554/2554978.png",
        tag: tag,
        renotify: true
      });
    }
  }

  onSnapshot(trucksCollection, (snapshot) => {
    if (!isInitialLoad) {
      snapshot.docChanges().forEach((change) => {
        const data = change.doc.data();
        if (change.type === "added") {
          sendMobilePush("🚛 New Truck Parked", `Plate: ${data.plate} at ${data.spot}`, `add-${data.plate}`);
        } else if (change.type === "modified" && data.status === "history") {
          sendMobilePush("🚩 Truck Departed", `Plate: ${data.plate} has exited the park`, `depart-${data.plate}`);
        }
      });
    }

    trucks = [];
    snapshot.forEach((docSnap) => {
      trucks.push({ id: docSnap.id, ...docSnap.data() });
    });

    render();
    isInitialLoad = false;
  });

  window.logoutAdmin = function() {
    sessionStorage.removeItem('authenticated');
    window.location.href = 'viewer.html';
  };

  function calculateDays(entryDateStr, exitDateStr = null) {
    const start = new Date(entryDateStr);
    const end = exitDateStr ? new Date(exitDateStr) : new Date();
    start.setHours(0,0,0,0);
    end.setHours(0,0,0,0);
    const diffTime = Math.abs(end - start);
    return Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
  }

  window.switchTab = function(tab) {
    currentTab = tab;
    document.getElementById('tabActive').classList.toggle('active', tab === 'active');
    document.getElementById('tabHistory').classList.toggle('active', tab === 'history');
    render();
  };

  window.handleSearchInput = function() {
    const input = document.getElementById('searchInput');
    document.getElementById('clearSearchBtn').classList.toggle('active', input.value.length > 0);
    render();
  };

  window.clearSearch = function() {
    const input = document.getElementById('searchInput');
    input.value = '';
    document.getElementById('clearSearchBtn').classList.remove('active');
    render();
  };

  function render() {
    const tbody = document.getElementById('tableBody');
    const mobileContainer = document.getElementById('mobileCardsContainer');
    const searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();
    
    tbody.innerHTML = '';
    mobileContainer.innerHTML = '';

    const activeList = trucks.filter(t => t.status === 'active');
    const historyList = trucks.filter(t => t.status === 'history');

    document.getElementById('activeCount').innerText = activeList.length;
    document.getElementById('historyCount').innerText = historyList.length;
    document.getElementById('stat-currently-parked').innerText = activeList.length;
    document.getElementById('stat-total-departed').innerText = historyList.length;
    document.getElementById('stat-total-visits').innerText = activeList.length + historyList.length;

    const targetList = currentTab === 'active' ? activeList : historyList;
    const filteredList = targetList.filter(t => {
      if (!searchTerm) return true;
      return (
        (t.plate && t.plate.toLowerCase().includes(searchTerm)) ||
        (t.spot && t.spot.toLowerCase().includes(searchTerm)) ||
        (t.details && t.details.toLowerCase().includes(searchTerm))
      );
    });

    const emptyState = document.getElementById('emptyState');
    emptyState.style.display = filteredList.length === 0 ? 'block' : 'none';

    filteredList.forEach(truck => {
      const days = calculateDays(truck.entryDate, truck.exitDate);
      let badgeClass = 'days-badge' + (days > 7 ? ' danger' : days > 3 ? ' warning' : '');

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><strong>${escapeHtml(truck.spot)}</strong></td>
        <td><span class="plate-tag">${escapeHtml(truck.plate)}</span></td>
        <td>${truck.entryDate}</td>
        <td><span class="${badgeClass}">${currentTab === 'active' ? 'Day ' + days : days + ' Days'}</span></td>
        <td>${escapeHtml(truck.details || '-')}</td>
        <td>
          <div style="display:flex; gap:6px;">
            ${currentTab === 'active' 
              ? `<button class="btn btn-outline" onclick="markDeparted('${truck.id}')"><i class="fa-solid fa-person-walking-arrow-right"></i> Exit</button>`
              : ''
            }
            <button class="btn btn-outline" onclick="openEditModal('${truck.id}')"><i class="fa-solid fa-pen"></i></button>
            <button class="btn btn-danger" onclick="deleteTruck('${truck.id}')"><i class="fa-solid fa-trash"></i></button>
          </div>
        </td>
      `;
      tbody.appendChild(tr);

      const card = document.createElement('div');
      card.className = 'truck-card';
      card.innerHTML = `
        <div class="truck-card-header">
          <span class="plate-tag">${escapeHtml(truck.plate)}</span>
          <span class="${badgeClass}">${currentTab === 'active' ? 'Day ' + days : days + ' Days'}</span>
        </div>
        <div class="truck-card-body">
          <div><strong>Spot:</strong> ${escapeHtml(truck.spot)}</div>
          <div><strong>Entry:</strong> ${truck.entryDate}</div>
          <div><strong>Details:</strong> ${escapeHtml(truck.details || 'N/A')}</div>
        </div>
        <div class="truck-card-actions">
          ${currentTab === 'active' 
            ? `<button class="btn btn-outline" style="flex:1" onclick="markDeparted('${truck.id}')"><i class="fa-solid fa-right-from-bracket"></i> Departure</button>`
            : ''
          }
          <button class="btn btn-outline" onclick="openEditModal('${truck.id}')"><i class="fa-solid fa-pen"></i> Edit</button>
          <button class="btn btn-danger" onclick="deleteTruck('${truck.id}')"><i class="fa-solid fa-trash"></i></button>
        </div>
      `;
      mobileContainer.appendChild(card);
    });
  }

  window.openAddModal = function() {
    document.getElementById('truckDocId').value = '';
    document.getElementById('truckForm').reset();
    document.getElementById('entryDateInput').value = new Date().toISOString().split('T')[0];
    document.getElementById('modalTitle').innerText = 'Register Truck Entry';
    document.getElementById('truckModal').classList.add('active');
  };

  window.openEditModal = function(id) {
    const t = trucks.find(item => item.id === id);
    if (!t) return;
    document.getElementById('truckDocId').value = t.id;
    document.getElementById('plateInput').value = t.plate;
    document.getElementById('spotInput').value = t.spot;
    document.getElementById('entryDateInput').value = t.entryDate;
    document.getElementById('detailsInput').value = t.details || '';
    document.getElementById('notesInput').value = t.notes || '';
    document.getElementById('modalTitle').innerText = 'Edit Truck Record';
    document.getElementById('truckModal').classList.add('active');
  };

  window.handleFormSubmit = async function(e) {
    e.preventDefault();
    const docId = document.getElementById('truckDocId').value;
    const data = {
      plate: document.getElementById('plateInput').value.trim().toUpperCase(),
      spot: document.getElementById('spotInput').value.trim(),
      entryDate: document.getElementById('entryDateInput').value,
      details: document.getElementById('detailsInput').value.trim(),
      notes: document.getElementById('notesInput').value.trim(),
      status: 'active'
    };

    if (docId) {
      await updateDoc(doc(db, "trucks", docId), data);
    } else {
      await addDoc(trucksCollection, data);
    }
    closeModal('truckModal');
  };

  window.markDeparted = async function(id) {
    if (confirm("Mark this truck as departed?")) {
      const today = new Date().toISOString().split('T')[0];
      await updateDoc(doc(db, "trucks", id), {
        status: 'history',
        exitDate: today
      });
    }
  };

  window.deleteTruck = async function(id) {
    if (confirm("Are you sure you want to permanently delete this record?")) {
      await deleteDoc(doc(db, "trucks", id));
    }
  };

  window.closeModal = function(id) {
    document.getElementById(id).classList.remove('active');
  };

  function escapeHtml(str) { return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : ''; }
</script>
</body>
</html>
