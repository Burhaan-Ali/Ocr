<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Truck Parking Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root {
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --bg-dark: #0f172a;
    --card-bg: #1e293b;
    --card-border: #334155;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --accent-green: #10b981;
    --accent-amber: #f59e0b;
    --accent-red: #ef4444;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
  body { background-color: var(--bg-dark); color: var(--text-main); padding: 16px; min-height: 100vh; }
  .container { max-width: 1000px; margin: 0 auto; }

  header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--card-border);
    flex-wrap: wrap; gap: 12px;
  }
  .header-title h1 { font-size: 1.5rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
  .header-title p { color: var(--text-muted); font-size: 0.85rem; margin-top: 2px; }
  .header-actions { display: flex; gap: 8px; align-items: center; }

  .stats-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; margin-bottom: 20px; }
  .stat-card {
    background: var(--card-bg); border: 1px solid var(--card-border);
    padding: 12px 16px; border-radius: 8px; text-align: center;
  }
  .stat-card .val { font-size: 1.4rem; font-weight: 700; color: var(--accent-green); }
  .stat-card .lbl { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

  .card {
    background: var(--card-bg); border: 1px solid var(--card-border);
    border-radius: 12px; padding: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
  }

  .toolbar { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .search-wrapper { position: relative; flex: 1; width: 100%; }
  .search-wrapper i.search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 1rem; }
  .search-wrapper input {
    background: #0f172a; border: 1px solid var(--card-border); color: var(--text-main);
    padding: 10px 36px 10px 42px; border-radius: 8px; font-size: 0.95rem; width: 100%; outline: none; height: 44px;
  }
  .clear-search {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    color: var(--text-muted); cursor: pointer; display: none; font-size: 0.9rem;
    background: transparent; border: none;
  }
  .clear-search:hover { color: var(--text-main); }
  .clear-search.active { display: block; }

  .btn {
    background: var(--primary); color: white; border: none; padding: 8px 14px;
    border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.85rem;
    display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
  }
  .btn:hover { background: var(--primary-hover); }
  .btn-outline { background: transparent; border: 1px solid var(--card-border); color: var(--text-main); }
  .btn-outline:hover { background: rgba(255, 255, 255, 0.05); }

  .desktop-table { display: none; width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
  @media (min-width: 768px) { .desktop-table { display: table; } }
  th { background: #0f172a; color: var(--text-muted); font-weight: 600; padding: 12px; border-bottom: 1px solid var(--card-border); white-space: nowrap; }
  td { padding: 12px; border-bottom: 1px solid var(--card-border); }

  .mobile-cards { display: flex; flex-direction: column; gap: 12px; }
  @media (min-width: 768px) { .mobile-cards { display: none; } }

  .truck-card {
    background: #0f172a; border: 1px solid var(--card-border);
    border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 10px;
  }
  .truck-card-header { display: flex; justify-content: space-between; align-items: center; }
  .truck-card-body { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 0.85rem; color: var(--text-muted); }
  .truck-card-actions { border-top: 1px solid var(--card-border); padding-top: 10px; display: flex; gap: 8px; }

  .plate-tag {
    background: #fbbf24; color: #000; font-family: monospace; font-weight: 700;
    padding: 4px 8px; border-radius: 4px; border: 2px solid #000; display: inline-block; letter-spacing: 1px; font-size: 0.9rem;
  }
  .days-badge {
    background: rgba(16, 185, 129, 0.15); color: var(--accent-green); font-weight: 700;
    padding: 4px 10px; border-radius: 12px; display: inline-flex; align-items: center; gap: 4px; font-size: 0.85rem;
  }
  .days-badge.warning { background: rgba(245, 158, 11, 0.15); color: var(--accent-amber); }
  .days-badge.danger { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); }

  .tab-buttons { display: flex; gap: 8px; margin-bottom: 14px; }
  .tab-btn {
    padding: 10px 14px; border-radius: 6px; background: transparent; flex: 1;
    border: 1px solid var(--card-border); color: var(--text-muted); cursor: pointer;
    font-size: 0.85rem; font-weight: 500; text-align: center;
  }
  .tab-btn.active { background: var(--primary); border-color: var(--primary); color: white; }

  .empty-state { text-align: center; padding: 40px; color: var(--text-muted); }
  .empty-state i { font-size: 2.5rem; margin-bottom: 12px; opacity: 0.5; }

  .modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85);
    display: flex; justify-content: center; align-items: center; z-index: 1000;
    opacity: 0; pointer-events: none; transition: opacity 0.2s; padding: 16px;
  }
  .modal-overlay.active { opacity: 1; pointer-events: auto; }
  .modal { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; width: 100%; max-width: 440px; padding: 20px; }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; border-bottom: 1px solid var(--card-border); padding-bottom: 10px; }
  .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }

  .history-timeline { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
  .history-card { background: #0f172a; border: 1px solid var(--card-border); border-radius: 8px; padding: 12px; display: flex; justify-content: space-between; align-items: center; }

  form { display: flex; flex-direction: column; gap: 12px; }
  .form-group { display: flex; flex-direction: column; gap: 6px; text-align: left; }
  label { font-size: 0.8rem; font-weight: 500; color: var(--text-muted); }
  .error-msg { color: var(--accent-red); font-size: 0.8rem; display: none; margin-top: 4px; }
  .error-msg.active { display: block; }

  /* Notification Bell Button */
  .btn-bell {
    background: transparent; border: 1px solid var(--card-border); color: var(--accent-amber);
    padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 6px;
  }
  .btn-bell.active { background: var(--accent-amber); color: #000; border-color: var(--accent-amber); font-weight: 700; }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-title">
      <h1><i class="fa-solid fa-truck-ramp-box"></i> TruckPark Log</h1>
      <p>Real-Time Parking Dashboard</p>
    </div>
    <div class="header-actions">
      <button class="btn-bell" id="enableNotifyBtn" onclick="requestNotificationPermission()">
        <i class="fa-solid fa-bell"></i> Enable Alerts
      </button>
      <button class="btn btn-outline" onclick="openLoginModal()"><i class="fa-solid fa-user-lock"></i> Admin</button>
    </div>
  </header>

  <div class="stats-bar">
    <div class="stat-card">
      <div class="val" id="stat-currently-parked">0</div>
      <div class="lbl">Parked</div>
    </div>
    <div class="stat-card">
      <div class="val" id="stat-total-departed" style="color: var(--accent-amber);">0</div>
      <div class="lbl">Departed</div>
    </div>
    <div class="stat-card">
      <div class="val" id="stat-total-visits" style="color: var(--primary);">0</div>
      <div class="lbl">Total Visits</div>
    </div>
  </div>

  <div class="tab-buttons">
    <button class="tab-btn active" id="tabActive" onclick="switchTab('active')">
      <i class="fa-solid fa-truck"></i> Parked (<span id="activeCount">0</span>)
    </button>
    <button class="tab-btn" id="tabHistory" onclick="switchTab('history')">
      <i class="fa-solid fa-clock-rotate-left"></i> Departed (<span id="historyCount">0</span>)
    </button>
  </div>

  <div class="card">
    <div class="toolbar">
      <div class="search-wrapper">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" id="searchInput" placeholder="Search plate, spot, details, notes, or date..." oninput="handleSearchInput()">
        <button class="clear-search" id="clearSearchBtn" onclick="clearSearch()"><i class="fa-solid fa-xmark"></i></button>
      </div>
    </div>

    <table class="desktop-table">
      <thead>
        <tr>
          <th>Spot</th>
          <th>Plate Number</th>
          <th>Entry Date</th>
          <th>Duration</th>
          <th>Details</th>
          <th>History</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>

    <div class="mobile-cards" id="mobileCardsContainer"></div>

    <div id="emptyState" class="empty-state" style="display: none;">
      <i class="fa-solid fa-magnifying-glass"></i>
      <p id="emptyStateText">No matching records found.</p>
    </div>
  </div>
</div>

<!-- HISTORY MODAL -->
<div class="modal-overlay" id="historyModal">
  <div class="modal">
    <div class="modal-header">
      <h3>Visit Timeline: <span id="historyPlateTitle" class="plate-tag"></span></h3>
      <i class="fa-solid fa-xmark" style="cursor: pointer;" onclick="closeModal('historyModal')"></i>
    </div>
    <div id="historyTimelineContainer" class="history-timeline"></div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('historyModal')">Close</button>
    </div>
  </div>
</div>

<!-- ADMIN LOGIN MODAL -->
<div class="modal-overlay" id="adminLoginModal">
  <div class="modal" style="text-align: center;">
    <i class="fa-solid fa-lock" style="font-size: 2.5rem; color: var(--primary); margin-bottom: 12px;"></i>
    <h3 style="margin-bottom: 8px;">Admin Login Required</h3>
    <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 16px;">Enter credentials to open the Admin Page.</p>
    
    <form id="adminLoginForm" onsubmit="handleAdminLogin(event)">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="adminUser" placeholder="Enter username" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="adminPass" placeholder="Enter password" required>
      </div>
      <div class="error-msg" id="adminLoginError">Invalid username or password.</div>
      <div class="modal-footer" style="padding:0; margin-top:10px;">
        <button type="button" class="btn btn-outline" onclick="closeModal('adminLoginModal')">Cancel</button>
        <button type="submit" class="btn">Login & Redirect</button>
      </div>
    </form>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDvjeTogG8mOArbl8K1m0JHC5y2UQO-Olo",
    authDomain: "parking-ea350.firebaseapp.com",
    projectId: "parking-ea350",
    storageBucket: "parking-ea350.firebasestorage.app",
    messagingSenderId: "415438583979",
    appId: "1:415438583979:web:96cd9482a8262bc66d5fee"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const trucksCollection = collection(db, "trucks");

  let trucks = [];
  let currentTab = 'active';
  let isInitialLoad = true;

  // Check Notification Status on Load
  window.addEventListener('DOMContentLoaded', () => {
    updateNotificationBtnStatus();
  });

  window.requestNotificationPermission = function() {
    if (!("Notification" in window)) {
      alert("This browser does not support mobile notifications.");
      return;
    }

    Notification.requestPermission().then((permission) => {
      updateNotificationBtnStatus();
      if (permission === "granted") {
        new Notification("Truck Park System", {
          body: "Mobile notification alerts activated!",
          icon: "https://cdn-icons-png.flaticon.com/512/2554/2554978.png"
        });
      }
    });
  };

  function updateNotificationBtnStatus() {
    const btn = document.getElementById('enableNotifyBtn');
    if (!("Notification" in window)) return;

    if (Notification.permission === "granted") {
      btn.classList.add('active');
      btn.innerHTML = `<i class="fa-solid fa-bell-circle-check"></i> Alerts Active`;
    } else {
      btn.classList.remove('active');
      btn.innerHTML = `<i class="fa-solid fa-bell"></i> Enable Alerts`;
    }
  }

  // Trigger Native Mobile System Notification
  function sendMobileNotification(plate, spot) {
    if ("Notification" in window && Notification.permission === "granted") {
      const spotText = spot ? ` (Spot: ${spot})` : '';
      const notification = new Notification("🚛 Truck Departed!", {
        body: `Plate: ${plate}${spotText}\nTap to open complete truck history.`,
        icon: "https://cdn-icons-png.flaticon.com/512/2554/2554978.png",
        tag: `truck-depart-${plate}`,
        renotify: true
      });

      // Tapping mobile system notification opens history modal
      notification.onclick = function (event) {
        event.preventDefault();
        window.focus();
        showTruckHistory(plate);
        notification.close();
      };
    }
  }

  // Firestore Real-Time Snapshot Listener
  onSnapshot(trucksCollection, (snapshot) => {
    if (!isInitialLoad) {
      snapshot.docChanges().forEach((change) => {
        if (change.type === "modified") {
          const data = change.doc.data();
          if (data.status === 'history') {
            sendMobileNotification(data.plate, data.spot);
          }
        }
      });
    }

    trucks = [];
    snapshot.forEach((docSnap) => {
      trucks.push({ id: docSnap.id, ...docSnap.data() });
    });

    render();
    isInitialLoad = false;
  });

  window.openLoginModal = function() {
    if (sessionStorage.getItem('authenticated') === 'true') {
      window.location.href = 'index.html';
    } else {
      document.getElementById('adminLoginModal').classList.add('active');
    }
  };

  window.handleAdminLogin = function(e) {
    e.preventDefault();
    const user = document.getElementById('adminUser').value;
    const pass = document.getElementById('adminPass').value;

    if (user === 'admin' && pass === 'parking123') {
      sessionStorage.setItem('authenticated', 'true');
      window.location.href = 'index.html';
    } else {
      document.getElementById('adminLoginError').classList.add('active');
    }
  };

  function calculateDays(entryDateStr, exitDateStr = null) {
    const start = new Date(entryDateStr);
    const end = exitDateStr ? new Date(exitDateStr) : new Date();
    start.setHours(0,0,0,0);
    end.setHours(0,0,0,0);
    const diffTime = Math.abs(end - start);
    return Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
  }

  window.switchTab = function(tab) {
    currentTab = tab;
    document.getElementById('tabActive').classList.toggle('active', tab === 'active');
    document.getElementById('tabHistory').classList.toggle('active', tab === 'history');
    render();
  };

  window.handleSearchInput = function() {
    const input = document.getElementById('searchInput');
    document.getElementById('clearSearchBtn').classList.toggle('active', input.value.length > 0);
    render();
  };

  window.clearSearch = function() {
    const input = document.getElementById('searchInput');
    input.value = '';
    document.getElementById('clearSearchBtn').classList.remove('active');
    render();
  };

  function render() {
    const tbody = document.getElementById('tableBody');
    const mobileContainer = document.getElementById('mobileCardsContainer');
    const searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();
    
    tbody.innerHTML = '';
    mobileContainer.innerHTML = '';

    const activeList = trucks.filter(t => t.status === 'active');
    const historyList = trucks.filter(t => t.status === 'history');

    const totalVisitsCount = activeList.length + historyList.length;

    document.getElementById('activeCount').innerText = activeList.length;
    document.getElementById('historyCount').innerText = historyList.length;
    document.getElementById('stat-currently-parked').innerText = activeList.length;
    document.getElementById('stat-total-departed').innerText = historyList.length;
    document.getElementById('stat-total-visits').innerText = totalVisitsCount;

    const targetList = currentTab === 'active' ? activeList : historyList;
    const filteredList = targetList.filter(t => {
      if (!searchTerm) return true;
      return (
        (t.plate && t.plate.toLowerCase().includes(searchTerm)) ||
        (t.spot && t.spot.toLowerCase().includes(searchTerm)) ||
        (t.details && t.details.toLowerCase().includes(searchTerm)) ||
        (t.notes && t.notes.toLowerCase().includes(searchTerm)) ||
        (t.entryDate && t.entryDate.includes(searchTerm)) ||
        (t.exitDate && t.exitDate.includes(searchTerm))
      );
    });

    const emptyState = document.getElementById('emptyState');
    if (filteredList.length === 0) {
      emptyState.style.display = 'block';
      document.getElementById('emptyStateText').innerText = searchTerm 
        ? `No results match "${searchTerm}"` 
        : "No records found in this category.";
    } else {
      emptyState.style.display = 'none';
    }

    filteredList.forEach(truck => {
      const days = calculateDays(truck.entryDate, truck.exitDate);
      let badgeClass = 'days-badge' + (days > 7 ? ' danger' : days > 3 ? ' warning' : '');

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><strong>${escapeHtml(truck.spot)}</strong></td>
        <td><span class="plate-tag">${escapeHtml(truck.plate)}</span></td>
        <td>${truck.entryDate}</td>
        <td><span class="${badgeClass}">${currentTab === 'active' ? 'Day ' + days : days + ' Days'}</span></td>
        <td>${escapeHtml(truck.details || '-')}</td>
        <td>
          <button class="btn btn-outline" onclick="showTruckHistory('${truck.plate}')">
            <i class="fa-solid fa-clock-rotate-left"></i> History
          </button>
        </td>
      `;
      tbody.appendChild(tr);

      const card = document.createElement('div');
      card.className = 'truck-card';
      card.innerHTML = `
        <div class="truck-card-header">
          <span class="plate-tag">${escapeHtml(truck.plate)}</span>
          <span class="${badgeClass}">${currentTab === 'active' ? 'Day ' + days : days + ' Days Total'}</span>
        </div>
        <div class="truck-card-body">
          <div><strong>Spot:</strong> ${escapeHtml(truck.spot)}</div>
          <div><strong>Entry:</strong> ${truck.entryDate}</div>
          ${truck.exitDate ? `<div><strong>Exit:</strong> ${truck.exitDate}</div>` : ''}
          <div><strong>Details:</strong> ${escapeHtml(truck.details || 'N/A')}</div>
        </div>
        <div class="truck-card-actions">
          <button class="btn btn-outline" style="width:100%" onclick="showTruckHistory('${truck.plate}')">
            <i class="fa-solid fa-clock-rotate-left"></i> View History
          </button>
        </div>
      `;
      mobileContainer.appendChild(card);
    });
  }

  window.showTruckHistory = function(plate) {
    const visits = trucks.filter(t => t.plate === plate).sort((a,b) => new Date(b.entryDate) - new Date(a.entryDate));
    const container = document.getElementById('historyTimelineContainer');
    document.getElementById('historyPlateTitle').innerText = plate;
    container.innerHTML = '';

    visits.forEach(v => {
      const days = calculateDays(v.entryDate, v.exitDate);
      const isCurrent = v.status === 'active';
      const div = document.createElement('div');
      div.className = 'history-card';
      div.innerHTML = `
        <div>
          <strong style="color: ${isCurrent ? 'var(--accent-green)' : 'var(--text-main)'}">
            ${isCurrent ? '🟢 Active Stay' : '⚪ Completed Stay'}
          </strong>
          <div style="font-size:0.8rem; color:var(--text-muted); margin-top:4px;">
            In: <strong>${v.entryDate}</strong> | Out: <strong>${v.exitDate || 'Parked Now'}</strong>
          </div>
        </div>
        <span class="days-badge ${isCurrent ? '' : 'warning'}">${days} Days</span>
      `;
      container.appendChild(div);
    });

    document.getElementById('historyModal').classList.add('active');
  };

  window.closeModal = function(id) {
    document.getElementById(id).classList.remove('active');
  };

  function escapeHtml(str) { return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : ''; }
</script>
</body>
</html>
